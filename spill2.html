<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fransk: skriv tallet som ord</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  button { font-size: 1.1rem; padding: .6rem 1.2rem; margin: .25rem .25rem .25rem 0; cursor: pointer; }
  input { font-size: 1.5rem; width: 100%; box-sizing: border-box; padding: .35rem; }
  #tall { font-size: 4rem; font-weight: bold; margin: .5rem 0; }
  .liten { color: #555; font-size: .9rem; }
  #tilbakemelding { min-height: 2.75rem; margin-top: .5rem; font-size: 1.1rem; }
  .riktig { color: #1b6e2d; }
  .feil { color: #a12020; }
  /* Kompakt topp: nivåknappene skal ikke dytte spillet og fremgangen ned. */
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  #nivaa button { font-size: .8rem; padding: .2rem .55rem; margin: 0 .2rem .2rem 0; }
  #nivaa { margin-bottom: .5rem; }
  #nivaa + p { margin: 0 0 .25rem; }
  .fv { margin: .75rem 0 !important; }
  [hidden] { display: none; }
  /* Bred skjerm: fremgangen står i en egen kolonne ved siden av spillet, så den er synlig mens du spiller. */
  @media (min-width: 62rem) {
    body { max-width: 58.5rem; display: grid; grid-template-columns: 26rem 1fr; column-gap: 2.5rem; align-items: start; }
    body > * { grid-column: 1; }
    body > #fremgang { grid-column: 2; grid-row: 1 / span 30; position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
    #fremgang .fv { margin-top: 0; }
  }
</style>
</head>
<body>
<h1>Skriv tallet som ord</h1>
<div id="nivaa"></div>
<p>Se tallet og skriv det på fransk. Store og små bokstaver og bindestrek mot mellomrom spiller ingen rolle.</p>
<p class="liten" id="stemmeinfo">Leter etter fransk stemme...</p>

<div id="start">
  <button id="startknapp">Start</button>
</div>

<div id="spill" hidden>
  <div id="tall" aria-live="polite"></div>
  <form id="skjema" autocomplete="off">
    <label for="svar">Tallet som ord:</label><br>
    <input id="svar" lang="fr" autocapitalize="off" spellcheck="false">
    <p><button id="sjekk" type="submit">Sjekk</button></p>
  </form>
  <div id="tilbakemelding" aria-live="polite"></div>
  <p>
    <button id="hor" type="button" hidden>Hør ordet</button>
    <button id="neste" type="button" hidden>Neste</button>
  </p>
  <p class="liten" id="telling"></p>
</div>

<div id="fremgang"></div>
<p class="liten"><button id="nullstill" type="button">Nullstill fremgang</button></p>

<p class="liten"><a href="index.html">Spill 1: lytt og skriv sifrene</a></p>

<script src="src/tall.js"></script>
<script src="src/stemme.js"></script>
<script src="src/fremgang.js"></script>
<script src="src/nivaa.js"></script>
<script src="src/feiring.js"></script>
<script src="src/fremgangsvisning.js"></script>
<script src="src/spill2.js"></script>
</body>
</html>
