<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French: write the sentence</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  button { color: #111; font-size: 1.1rem; padding: .6rem 1.2rem; margin: .25rem .25rem .25rem 0; cursor: pointer; }
  .liten { color: #555; font-size: .9rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  #tema { margin-bottom: .5rem; }
  #tema button { font-size: .8rem; padding: .2rem .55rem; margin: 0 .2rem .2rem 0; }
  @media (max-width: 30rem) {
    #tema { display: flex; flex-wrap: wrap; gap: .4rem; }
    #tema button { min-height: 2.75rem; padding: .3rem .8rem; margin: 0; }
  }
  #setning { font-size: 1.6rem; margin: .5rem 0 .25rem; line-height: 2.6rem; }
  #oversettelse { font-size: 1.4rem; margin: .5rem 0 .75rem; }
  #hint { font-family: ui-monospace, Consolas, monospace; font-size: 1.3rem; letter-spacing: .05em; margin: 0 0 .5rem; }
  .hull.helt { width: 100%; text-align: left; }
  .hull { font-size: 1.4rem; width: 6.5ch; box-sizing: border-box; padding: .15rem .3rem; text-align: center; }
  .hull.galt { border: 2px solid #a12020; background: #fdecec; }
  #info { min-height: 1.5em; font-weight: 600; margin: .25rem 0; }
  #tilbakemelding { min-height: 2.75rem; margin-top: .5rem; font-size: 1.1rem; }
  #regel { color: #333; font-size: .95rem; margin: .25rem 0; }
  .riktig { color: #1b6e2d; }
  .feil { color: #a12020; }
  .fv { margin: .75rem 0 !important; }
  [hidden] { display: none; }
  @media (min-width: 62rem) {
    body { max-width: 58.5rem; display: grid; grid-template-columns: 26rem 1fr; column-gap: 2.5rem; align-items: start; }
    body > * { grid-column: 1; }
    body > #hoved { display: contents; }
    #hoved > * { grid-column: 1; }
    #hoved > #fremgang { grid-column: 2; grid-row: 1 / span 30; position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
    #fremgang .fv { margin-top: 0; }
  }
  #svak { border: 2px solid #111; padding: .5rem 1rem; margin: 1rem 0; }
  #svakEksempler p { margin: .25rem 0; }
  #svakEksempler .fr { font-size: 1.2rem; }
  #streak { min-height: 1.5em; margin: 0.25rem 0; font-weight: 600; }
  #streak.bonus { color: #0a6b2d; }
</style>
</head>
<body>
<h1 id="h1"></h1>

<div id="kjonn" hidden>
  <h2 id="kjonnTittel"></h2>
  <p id="kjonnTekst"></p>
  <button id="kjonnF" type="button"></button>
  <button id="kjonnM" type="button"></button>
</div>

<div id="hoved" hidden>
  <div id="tema"></div>
  <p id="intro"></p>
  <p class="liten" id="stemmeinfo"></p>

  <div id="start">
    <button id="startknapp" data-t="knapp.start">Start</button>
  </div>

  <div id="spill" hidden>
    <p id="info" aria-live="polite"></p>
    <form id="skjema" autocomplete="off">
      <p id="oversettelse"></p>
      <div id="setning" lang="fr"></div>
      <p id="hint" class="liten" lang="fr" hidden></p>
      <p><button id="sjekk" type="submit" data-t="knapp.sjekk">Check</button> <button id="oe" type="button" class="liten-knapp" lang="fr" aria-label="œ" title="œ">œ</button></p>
    </form>
    <div id="tilbakemelding" aria-live="polite"></div>
    <p id="regel"></p>
    <p>
      <button id="hor" type="button" hidden></button>
      <button id="neste" type="button" hidden data-t="knapp.neste">Next</button>
    </p>
    <p class="liten" id="telling"></p>
    <p id="streak" aria-live="polite"></p>
  </div>

  <div id="profil" hidden>
    <h2 id="profilTittel"></h2>
    <p id="profilTekst"></p>
    <form id="profilSkjema" autocomplete="off">
      <p><label for="yrke" id="yrkeEtikett"></label><br><input id="yrke" type="text" lang="fr" maxlength="40"></p>
      <p><label for="alder" id="alderEtikett"></label><br><input id="alder" type="number" min="1" max="120"></p>
      <p><button id="profilLagre" type="submit"></button> <button id="profilEksport" type="button"></button></p>
      <p id="profilMelding" class="feil" aria-live="polite"></p>
    </form>
  </div>

  <div id="fremgang"></div>
  <p class="liten" id="profilHint"></p>
  <p class="liten">
    <button id="nullstill" type="button" data-t="knapp.nullstill">Reset progress</button>
    <button id="byttForm" type="button"></button>
    <button id="profilKnapp" type="button"></button>
  </p>
  <p class="liten"><a href="spill3.html" id="lenke3"></a></p>
  <p class="liten"><a href="index.html" id="menyLenke"></a></p>
</div>

<script src="src/tekster.js"></script>
<script src="src/tekster3.js"></script>
<script src="src/setninger.js"></script>
<script src="src/trinn.js"></script>
<script src="src/sjekk.js"></script>
<script src="src/stemme.js"></script>
<script src="src/fremgang.js"></script>
<script src="src/feiring.js"></script>
<script src="src/fremgangsvisning.js"></script>
<script src="src/spill4.js"></script>
</body>
</html>
