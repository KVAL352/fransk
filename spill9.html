<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French: autumn words</title>
<style>
  /* Skala: 0.875 (meta) · 1.125 (tekst, knapper) · 1.5 (svarvalg, tittel) · 2.5 (ordet). Samme uttrykk som spill 8. */
  :root {
    --svart: #1c1c1a; --papir: #ecebe6; --kort: #f8f7f3; --linje: #c9c6bd; --dempet: #55524b;
    --rod: #b3261e; --gull: #f6c945;
    --inn: cubic-bezier(0,0,.38,.9); --standard: cubic-bezier(.2,0,.38,.9);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papir); color: var(--svart); font-family: system-ui, sans-serif; font-size: 1.125rem; line-height: 1.5; }
  button { font: inherit; color: var(--svart); cursor: pointer; }
  [hidden] { display: none !important; }
  .side { max-width: 32rem; margin: 0 auto; padding: 1.5rem 16px 3rem; }
  h1 { font-size: 1.125rem; margin: 0 0 1rem; }

  /* Temakart: seks fliser. Ferdig = gull med hake, neste = åpen, resten = låst */
  .kart { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: .5rem; }
  .flis { position: relative; aspect-ratio: 1; border: 2px solid var(--svart); border-radius: 8px; background: var(--kort); display: grid; place-items: center; font-size: 1.5rem; }
  .flis.na { outline: 2px solid var(--svart); outline-offset: 2px; }
  .flis.last { background: #d9d6cc; border-style: dashed; color: var(--dempet); }
  .flis.last span { filter: grayscale(1); opacity: .45; }
  .flis:not(.last) { background: linear-gradient(to top, var(--gull) calc(var(--andel, 0) * 100%), var(--kort) calc(var(--andel, 0) * 100%)); }
  .flis.ferdig { background: var(--gull); }
  .hake { position: absolute; right: -6px; top: -6px; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--svart); color: var(--gull); font-size: .75rem; display: grid; place-items: center; font-style: normal; }
  .temalinje { font-size: .875rem; color: var(--dempet); margin: 0 0 1.5rem; }
  .temalinje strong { color: var(--svart); font-weight: 600; }

  .kort { position: relative; background: var(--kort); border: 2px solid var(--svart); border-radius: 8px; padding: 1.25rem 1.25rem 1.5rem; transition: background-color .24s var(--inn), border-color .24s var(--inn); }
  .kort::before { content: ""; position: absolute; left: -2px; right: -2px; top: -2px; height: 8px; background: var(--svart); border-radius: 8px 8px 0 0; }
  .kort.ferdig::before { display: none; }
  .kort.ferdig { background-color: var(--gull); }
  .formlinje { position: relative; height: 8px; margin-top: .5rem; border: 1px solid var(--svart); border-radius: 3px; background: #e2e0d8; overflow: hidden; }
  .formlinje i { position: absolute; inset: 0; background: var(--svart); transform-origin: left; transform: scaleX(0); transition: transform .3s var(--standard), background-color .3s var(--standard); }
  .pa-rad { position: absolute; top: -.9rem; right: 1rem; margin: 0; padding: .15rem .7rem; border: 2px solid var(--svart); border-radius: 6px; background-color: var(--gull); font-size: .875rem; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s var(--inn); }
  .pa-rad.vis { opacity: 1; }

  .bildeboks { height: clamp(6rem, 28vh, 13rem); display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--linje); border-radius: 6px; margin: 1rem 0 .75rem; overflow: hidden; }
  .bildeboks img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .bildeboks img.emoji { height: 8rem; width: 8rem; }
  .hint { font-family: ui-monospace, Consolas, monospace; font-size: 1.5rem; letter-spacing: .05em; margin: 0 0 .75rem; min-height: 1.5em; }
  .hor { display: block; margin: 0 0 1rem; padding: .35rem .9rem; border: 2px solid var(--svart); border-radius: 6px; background: #fff; }

  .valg { display: flex; flex-direction: column; gap: .5rem; }
  .valg button { font-size: 1.5rem; text-align: start; padding: .55rem 1rem; background: #fff; border: 2px solid var(--linje); border-radius: 6px; }
  .valg button:disabled { cursor: default; }
  .valg button.riktig { border-color: var(--svart); background: var(--gull); }
  .valg button.feil { border-color: var(--rod); background: var(--kort); color: var(--rod); }
  .skriv { display: flex; gap: .5rem; }
  .skriv input { flex: 1; min-width: 0; font: inherit; font-size: 1.5rem; padding: .4rem .6rem; border: 2px solid var(--linje); border-radius: 6px; background: #fff; }
  .skriv input.galt { border-color: var(--rod); background: var(--kort); color: var(--rod); }
  .skriv input.rett { border-color: var(--svart); background: var(--gull); }
  .skriv input:disabled { opacity: 1; }
  .skriv button, .handling button { padding: .55rem 1.2rem; border: 2px solid var(--svart); border-radius: 6px; background: #fff; }
  .valg button:focus-visible, .handling button:focus-visible, .skriv button:focus-visible, .hor:focus-visible, .skriv input:focus-visible { outline: 3px solid var(--svart); outline-offset: 2px; }
  .kort.riktig-blink { border-color: var(--svart); }
  .skjult { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .svar { margin-top: 1rem; min-height: 1.7em; }
  .svar p { margin: 0; }
  .svar .feil { color: var(--rod); font-weight: 600; }
  .svar .regel { color: var(--dempet); margin-top: .35rem; }
  .svar .betyd { margin-top: .35rem; }

  .handling { display: flex; gap: .5rem; margin-top: 1rem; position: sticky; bottom: 0; padding: .5rem 0; background: var(--papir); }
  .handling .neste { background: var(--svart); color: #fff; margin-left: auto; }

  .under { margin-top: 2.5rem; font-size: .875rem; color: var(--dempet); display: flex; justify-content: space-between; gap: 1rem; }
  .under a, .under button { color: var(--dempet); font-size: .875rem; background: none; border: 0; padding: 0; text-decoration: underline; }
  #start button { padding: .55rem 1.2rem; border: 2px solid var(--svart); border-radius: 6px; background: var(--svart); color: #fff; }

  /* Lave skjermer: alt skal få plass uten å scrolle til Neste */
  @media (max-height: 760px) {
    .side { padding-top: .75rem; padding-bottom: 1rem; }
    h1 { margin-bottom: .5rem; }
    .flis { aspect-ratio: auto; height: 2.5rem; font-size: 1.25rem; }
    .temalinje { margin-bottom: .75rem; }
    .kort { padding: .75rem 1rem 1rem; }
    .bildeboks { height: clamp(5rem, 24vh, 11rem); margin: .6rem 0 .5rem; }
    .hint { font-size: 1.25rem; margin-bottom: .4rem; }
    .valg { gap: .35rem; }
    .valg button { font-size: 1.25rem; padding: .35rem .8rem; }
    .skriv input { font-size: 1.25rem; padding: .3rem .5rem; }
    .svar { margin-top: .5rem; }
    .handling { margin-top: .5rem; }
    .under { margin-top: 1rem; }
  }
  /* Liggende mobil: bilde til venstre, svar til høyre */
  @media (orientation: landscape) and (max-height: 520px) {
    .side { max-width: 48rem; }
    .kort { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1rem; align-content: start; }
    .kort > * { grid-column: 2; }
    .kort > .formlinje { grid-column: 1 / -1; }
    .kort > .bildeboks { grid-column: 1; grid-row: 2 / span 6; height: 100%; min-height: 8rem; margin: 0; }
    .flis { height: 2rem; font-size: 1rem; }
    h1, .temalinje { display: none; }
    .kort > .bildeboks { height: 55vh; min-height: 0; align-self: start; }
    .valg button { font-size: 1.1rem; padding: .25rem .7rem; }
  }
  @media (max-height: 640px) {
    .temalinje { display: none; }
    .flis { height: 2rem; }
    .bildeboks { height: clamp(4rem, 20vh, 9rem); margin: .4rem 0; }
    .valg button { font-size: 1.15rem; padding: .25rem .7rem; }
    .kort { padding: .6rem .8rem .8rem; }
    .svar { min-height: 1.4em; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .kort.inn { animation: inn .2s var(--inn); }
    .kort.riktig-blink { animation: stempel .3s var(--inn); }
    .pa-rad.vis { animation: merke .35s var(--inn); }
    .flis.ny { animation: lås .5s var(--inn); }
  }
  @keyframes merke { 0% { transform: translateY(6px) scale(.8); } 60% { transform: translateY(0) scale(1.12); } 100% { transform: none; } }
  @keyframes inn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes stempel { 0% { transform: scale(1); } 40% { transform: scale(1.02); } 100% { transform: scale(1); } }
  @keyframes lås { 0% { transform: scale(.9); } 60% { transform: scale(1.12); } 100% { transform: none; } }
  .lastlenke { display: inline-block; padding: .55rem 1.2rem; border: 2px solid var(--svart); border-radius: 6px; background: var(--svart); color: #fff; text-decoration: none; }
</style>
</head>
<body>
<div class="side">
  <h1 id="h1"></h1>
  <div class="kart" id="kart" role="list"></div>
  <p class="temalinje" id="temalinje"></p>

  <div id="last" hidden>
    <p id="lastTekst"></p>
    <a href="hostpakke.html" id="lastLenke" class="lastlenke"></a>
  </div>

  <div id="start">
    <p id="intro"></p>
    <button id="startknapp" type="button" data-t="knapp.start">Start</button>
  </div>

  <div id="spill" hidden>
    <article class="kort" id="kort" aria-live="polite">
      <div class="formlinje" id="formlinje" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="formfyll"></i></div>
      <p class="pa-rad" id="paRad"></p>
      <div class="bildeboks"><img id="bilde" alt=""></div>
      <p class="hint" id="hint" lang="fr" hidden></p>
      <div class="valg" id="valg" lang="fr"></div>
      <form class="skriv" id="skjema" autocomplete="off" hidden>
        <input id="svar" type="text" lang="fr" dir="ltr" autocapitalize="off" autocomplete="off" spellcheck="false">
        <button id="sjekk" type="submit" data-t="knapp.sjekk">Check</button>
      </form>
      <div class="svar" id="tilbakemelding"></div>
      <button type="button" class="hor" id="hor" hidden></button>
    </article>

    <div class="handling">
      <button type="button" class="neste" id="neste" hidden data-t="knapp.neste">Next</button>
    </div>
  </div>

  <div class="under">
    <a href="hostpakke.html" id="menyLenke"></a>
    <button id="nullstill" type="button" data-t="knapp.nullstill">Reset progress</button>
    <a href="kreditt.html#bilder" id="kredittLenke"></a>
  </div>
  <p id="stemmeinfo" hidden></p>
</div>

<script src="src/tekster.js"></script>
<script src="src/tekster3.js"></script>
<script src="src/sjekk.js"></script>
<script src="src/ord.js"></script>
<script src="src/host.js"></script>
<script src="src/stemme.js"></script>
<script src="src/fremgang.js"></script>
<script src="src/feiring.js"></script>
<script src="src/verb.js"></script>
<script src="src/hostpakke.js"></script>
<script src="src/spill9.js"></script>
</body>
</html>
