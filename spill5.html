<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French: name the picture</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  button { color: #111; font-size: 1.1rem; padding: .6rem 1.2rem; margin: .25rem .25rem .25rem 0; cursor: pointer; }
  .liten { color: #555; font-size: .9rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  #bildeboks { width: 100%; max-width: 22rem; height: 14rem; display: flex; align-items: center; justify-content: center; background: #f4f4f4; border: 1px solid #ddd; margin: .5rem 0; }
  #bilde { max-width: 100%; max-height: 100%; object-fit: contain; }
  #bilde.emoji { height: 9rem; width: 9rem; }
  #hint { font-family: ui-monospace, Consolas, monospace; font-size: 1.3rem; letter-spacing: .05em; white-space: pre-wrap; margin: 0 0 .5rem; min-height: 1.6em; }
  #svar { font-size: 1.4rem; width: 100%; box-sizing: border-box; padding: .3rem .5rem; }
  #svar.galt { border: 2px solid #a12020; background: #fdecec; }
  #info { min-height: 1.5em; font-weight: 600; margin: .25rem 0; }
  #tilbakemelding { min-height: 2.75rem; margin-top: .5rem; font-size: 1.1rem; }
  #eksempel { color: #333; font-size: 1rem; margin: .25rem 0; }
  .riktig { color: #1b6e2d; }
  .feil { color: #a12020; }
  .fv { margin: .75rem 0 !important; }
  [hidden] { display: none; }
  @media (min-width: 62rem) {
    body { max-width: 58.5rem; display: grid; grid-template-columns: 26rem 1fr; column-gap: 2.5rem; align-items: start; }
    body > * { grid-column: 1; }
    body > #hoved { display: contents; }
    #hoved > * { grid-column: 1; }
    #hoved > #fremgang { grid-column: 2; grid-row: 1 / span 30; position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
    #fremgang .fv { margin-top: 0; }
  }
  #streak { min-height: 1.5em; margin: 0.25rem 0; font-weight: 600; }
  #streak.bonus { color: #0a6b2d; }
</style>
</head>
<body>
<h1 id="h1"></h1>

<div id="hoved">
  <p id="intro"></p>

  <div id="start">
    <button id="startknapp" data-t="knapp.start">Start</button>
  </div>

  <div id="spill" hidden>
    <p id="info" aria-live="polite"></p>
    <div id="bildeboks"><img id="bilde" alt=""></div>
    <p id="hint" class="liten" lang="fr" hidden></p>
    <form id="skjema" autocomplete="off">
      <p><input id="svar" type="text" lang="fr" dir="ltr" autocapitalize="off" autocomplete="off" spellcheck="false"></p>
      <p><button id="sjekk" type="submit" data-t="knapp.sjekk">Check</button></p>
    </form>
    <div id="tilbakemelding" aria-live="polite"></div>
    <p id="eksempel" lang="fr"></p>
    <p><button id="neste" type="button" hidden data-t="knapp.neste">Next</button></p>
    <p class="liten" id="telling"></p>
    <p id="streak" aria-live="polite"></p>
  </div>

  <div id="fremgang"></div>
  <p class="liten">
    <button id="nullstill" type="button" data-t="knapp.nullstill">Reset progress</button>
  </p>
  <p class="liten"><a href="spill6.html" id="annenLenke"></a></p>
  <p class="liten"><a href="index.html" id="menyLenke"></a></p>
  <p class="liten"><a href="kreditt.html#bilder" id="kredittLenke"></a></p>
</div>

<script src="src/tekster.js"></script>
<script src="src/tekster3.js"></script>
<script src="src/setninger.js"></script>
<script src="src/sjekk.js"></script>
<script src="src/ord.js"></script>
<script src="src/fremgang.js"></script>
<script src="src/feiring.js"></script>
<script src="src/fremgangsvisning.js"></script>
<script>window.SPILLOPPSETT = { spill: "spill5", type: "bestemt" };</script>
<script src="src/spill5.js"></script>
</body>
</html>
